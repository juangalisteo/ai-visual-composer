schema_version: 1
id: modo_conciencia.root
version: "1.0.0"
type: root
title: Modo Conciencia Root Visual Bible
extends: null
composes:
metadata:
  owner: Modo Conciencia
  status: draft
  description: Root visual bible for the channel.
inheritance_policy:
  locked:
    - philosophy.beauty
    - philosophy.elegance
    - philosophy.sobriety
    - philosophy.excess
    - philosophy.artifice
    - philosophy.authenticity
    - philosophy.naturalness
    - philosophy.non_negotiable_principles
    - philosophy.incompatible_images
    - creative_limits
    - quality.coherence
    - quality.belonging
  appendable:
    - philosophy.non_negotiable_principles
    - philosophy.incompatible_images
    - symbolic_system.allowed_symbols
    - symbolic_system.recurring_symbols
    - symbolic_system.forbidden_symbols
    - realism_and_abstraction.artifice_limits
    - color.colors_to_avoid
    - color.evolution_rules
    - creative_limits.foreign_styles
    - creative_limits.cliches
    - creative_limits.excesses
    - creative_limits.incompatible_resources
    - creative_limits.unacceptable_artifice_levels
  overridable:
    - identity.dominant_tone
    - identity.recognition
    - cinematic_language.rhythm
    - cinematic_language.audiovisual_energy
    - composition.density
    - composition.hierarchy
    - photography.emotional_distance
    - photography.subject_relationship
    - lighting.contrast
    - lighting.atmosphere
    - color.dominant_temperature
    - color.base_palette
    - texture_and_materiality.grain
    - continuity.atmosphere
    - continuity.symbols
    - quality.specificity
visual_bible:
  philosophy:
    beauty: sober contemplative beauty
    elegance: quiet precision
    sobriety: restrained visual clarity
    excess: decorative spectacle rejected
    artifice: only motivated artifice
    authenticity: credible physical presence
    naturalness: unforced visual presence
    non_negotiable_principles:
      - no generic spectacle
      - no empty mysticism
    incompatible_images:
      - decorative portal without meaning
      - artificial neon spirituality
  identity:
    visual_statement: contemplative cinematic clarity
    sensibility: grounded and introspective
    dominant_tone: calm
    visual_personality: restrained and lucid
    recognition: sober symbolic realism
  cinematic_language:
    rhythm: slow
    observational_distance: measured
    immersion: quiet
    theatricality: contained
    audiovisual_energy: low
  realism_and_abstraction:
    realism_level: grounded
    stylization_level: restrained
    abstraction_level: symbolic but legible
    poetic_license: controlled
    artifice_limits:
      - no unmotivated surrealism
  symbolic_system:
    allowed_symbols:
      - reflection
      - geometry
    recurring_symbols:
      - scale echoes
    forbidden_symbols:
      - literal magic portal
    literalness: low
    metaphor_degree: moderate
  composition:
    balance: calm balance
    negative_space: generous
    density: low
    scale: clear
    hierarchy: one clear idea
    figure_ground_relationship: clean separation
  photography:
    point_of_view: observational
    emotional_distance: respectful
    depth: layered
    optical_texture: natural
    naturalism: photographic
    subject_relationship: quiet attention
  lighting:
    dominant_source: motivated soft source
    motivation: diegetic
    contrast: gentle
    shadow: present but readable
    visibility: clear
    atmosphere: subtle
  color:
    dominant_temperature: warm neutral
    base_palette:
      - graphite
      - soft gold
    secondary_palettes:
      - muted stone
    saturation: low
    contrast: measured
    colors_to_avoid:
      - neon excess
    evolution_rules:
      - preserve contemplative warmth
  texture_and_materiality:
    preferred_materials:
      - paper
      - stone
    tactility: visible
    grain: subtle
    detail: credible
    polish: not plastic
    naturalness: materially grounded
  continuity:
    atmosphere: quiet
    light: motivated
    color: restrained
    symbols: controlled recurrence
    scale: macro and micro relation
    density: low
  creative_limits:
    foreign_styles:
      - generic sci fi gloss
    cliches:
      - glowing portal
    excesses:
      - decorative complexity
    incompatible_resources:
      - stock fantasy spectacle
    unacceptable_artifice_levels:
      - unmotivated surrealism
  quality:
    coherence: belongs to the whole
    elegance: quiet
    specificity: concrete
    naturalness: unforced
    cinematic_strength: strong but restrained
    generic_aesthetic_absence: no default ai look
    belonging: consistent with philosophy
