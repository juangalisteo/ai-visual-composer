# Solo configuración de herramientas. Las dependencias se instalan con requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_run_log: el test usa el registro real de la ejecución (output/<proyecto>/registro.txt)",
    "real_whisper_cuda_cache: el test usa la carpeta de la caché de CUDA de Whisper que declara config/whisper.json",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
